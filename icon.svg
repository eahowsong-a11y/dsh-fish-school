<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Fish school icon - multiple stylized fish in a group -->
  <g fill="#247bbf">
    <!-- Large fish -->
    <ellipse cx="32" cy="32" rx="16" ry="10" opacity="0.9"/>
    <path d="M 16 32 L 10 28 L 10 36 Z" opacity="0.9"/>
    <circle cx="42" cy="30" r="2" fill="#fff"/>
    
    <!-- Small fish 1 -->
    <ellipse cx="20" cy="20" rx="10" ry="6" opacity="0.7"/>
    <path d="M 10 20 L 6 17 L 6 23 Z" opacity="0.7"/>
    <circle cx="26 " cy="19" r="1.5" fill="#fff"/>
    
    <!-- Small fish 2 -->
    <ellipse cx="44" cy="44" rx="10" ry="6" opacity="0.7"/>
    <path d="M 34 44 L 30 41 L 30 47 Z" opacity="0.7"/>
    <circle cx="50" cy="43" r="1.5" fill="#fff"/>
    
    <!-- Small fish 3 -->
    <ellipse cx="52" cy="24" rx="8" ry="5" opacity="0.6"/>
    <path d="M 44 24 L 41 22 L 41 26 Z" opacity="0.6"/>
    <circle cx="57" cy="23" r="1.2" fill="#fff"/>
  </g>
  
  <!-- Connection lines indicating network -->
  <g stroke="#247bbf" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="2,2">
    <line x1="25" y1="24" x2="28" y2="28"/>
    <line x1="38" y1="36" x2="42" y2="42"/>
    <line x1="46" y1="28" x2="38" y2="30"/>
  </g>
</svg>
