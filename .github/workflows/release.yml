name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --check index.js
          node --check lib/network.js
          node --check lib/store.js
      - name: Build tarball
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' package.json)
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$VERSION  tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          mkdir -p dist
          npm pack --pack-destination=dist/
          mv dist/local-fish-school-*.tgz "dist/fish-$VERSION.tgz"
          ls -l dist/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fish-*.tgz
          generate_release_notes: true
          body: |
            # Fish School v${{ env.VERSION }}

            ## Upgrade

            No uninstall needed. Both paths below were tested on 1.4.0:

            **Standard — requires a DSH restart**
            ```powershell
            cd C:\harper\dsh-fish-school
            .\update-local.ps1 -Version "${{ env.VERSION }}"
            ```
            `pnpm install` replaces `node_modules\@local\fish-school`, so DSH answers
            `restart-required (package-moved)`. Quit and reopen DSH; a page refresh
            is not enough.

            **Hot — no restart**
            ```powershell
            .\update-local.ps1 -Version "${{ env.VERSION }}" -Hot
            ```
            Overwrites the files in place, then reload the plugin in
            Settings → Plugins → fish-school.

            **Manual**
            1. Download `fish-${{ env.VERSION }}.tgz` and save it as `C:\harper\fish.tgz`
            2. `cd $env:USERPROFILE\.dsh\profiles\desktop`
            3. `pnpm install --no-frozen-lockfile`
            4. Restart DSH

            Knowledge and conversations live in
            `%USERPROFILE%\.dsh\profiles\desktop\fish-school\` and are untouched by
            an upgrade.

            ## What's New
            See commit log for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
